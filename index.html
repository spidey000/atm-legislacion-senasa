<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador ATCO</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f5f7;color:#1d1d1f;display:grid;place-items:center;min-height:100vh;margin:0}p{color:#6e6e73}</style></head><body><p>Cargando simulador…</p><script>(async()=>{const s=(await fetch("app.b64").then(r=>r.text())).trim(),b=Uint8Array.from(atob(s),c=>c.charCodeAt(0)),z=new Blob([b]).stream().pipeThrough(new DecompressionStream("gzip")),h=await new Response(z).text();document.open();document.write(h);document.close()})().catch(e=>{document.body.innerHTML="<p>No se pudo cargar el simulador. Ábrelo desde GitHub Pages o un servidor HTTP local.</p>";console.error(e)});</script></body></html>
