name: Materialize web data

on:
  push:
    paths:
      - build/ready.txt

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Materialize normal JavaScript data files
        run: python3 scripts/materialize_data.py

      - name: Commit normal web structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Materialize normal web structure"
          git push
